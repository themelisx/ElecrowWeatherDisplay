; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .

[env:ELECROW_DISPLAY_50]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1-myboard
framework = arduino

monitor_dtr = 0
monitor_speed = 115200

build_type = debug
monitor_filters = esp32_exception_decoder

;platform_packages = platformio/framework-arduinoespressif32

build_flags = 
	-I./include
	-D${PIOENV}
	-D LV_CONF_PATH=lv_conf.h
	-DCORE_DEBUG_LEVEL=3
    -DMBEDTLS_SSL_MAX_CONTENT_LEN=16384
    -DMBEDTLS_SSL_PROTO_TLS1_2
    -DMBEDTLS_TLS_DEFAULT_ALLOW_SHA1_IN_CERTIFICATES
    -DMBEDTLS_SSL_CIPHERSUITES=MBEDTLS_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

lib_deps = 
	lvgl/lvgl@8.3.11
	bblanchon/ArduinoJson@^7.4.2
	bitbank2/PNGdec@^1.1.6
	lovyan03/LovyanGFX@^1.2.7
	adafruit/Adafruit SSD1306@^2.5.15
	fbiego/ESP32Time@^2.0.6
	tamctec/TAMC_GT911@^1.0.2
	https://github.com/themelisx/MyDebug.git
	https://github.com/themelisx/MyWiFi.git
	https://github.com/themelisx/MySettings.git

board_build.partitions = elecrow_4MB.csv

[env:ELECROW_DISPLAY_70]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino

monitor_dtr = 0
monitor_speed = 115200

build_type = debug
monitor_filters = esp32_exception_decoder

platform_packages = platformio/framework-arduinoespressif32

build_flags = 
	-I./include
	-D${PIOENV}
	-D LV_CONF_PATH=lv_conf.h

lib_deps = 
	lvgl/lvgl@8.3.11
	bblanchon/ArduinoJson@^7.4.2
	bitbank2/PNGdec@^1.1.6
	lovyan03/LovyanGFX@^1.2.7
	adafruit/Adafruit SSD1306@^2.5.15
	fbiego/ESP32Time@^2.0.6
	tamctec/TAMC_GT911@^1.0.2
	https://github.com/themelisx/MyDebug.git
	https://github.com/themelisx/MyWiFi.git
	https://github.com/themelisx/MySettings.git

board_build.partitions = elecrow_4MB.csv
